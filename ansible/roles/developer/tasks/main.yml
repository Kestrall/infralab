---
- name: Install development tools
  ansible.builtin.apt:
    name:
      - git
      - make
      - gcc
      - g++
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

- name: Check Git version
  ansible.builtin.command:
    cmd: git --version
  register: developer_git_version
  changed_when: false
  # noqa: command-instead-of-module — the git module has no way to report the installed version

- name: Display Git version
  ansible.builtin.debug:
    msg: "{{ developer_git_version.stdout }}"

- name: Check Python version
  ansible.builtin.command:
    cmd: python3 --version
  register: developer_python_version
  changed_when: false

- name: Display Python version
  ansible.builtin.debug:
    msg: "{{ developer_python_version.stdout }}"
