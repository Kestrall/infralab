---
- name: Install k3s agent
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  environment:
    K3S_URL: "{{ k3s_url }}"
    K3S_TOKEN: "{{ k3s_token }}"

- name: Enable k3s-agent service
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
